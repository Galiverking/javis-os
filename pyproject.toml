[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "javis-os"
version = "0.2.0"
description = "Javis OS - Precision Voice & Desktop Interface Layer (100% Free Stack)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Apichet & AI Engineering Team" }
]
dependencies = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "edge-tts>=6.1.12",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
javis = "javis.cli:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
